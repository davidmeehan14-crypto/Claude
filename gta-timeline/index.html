function richLines(str, o, maxW) {
  const toks = []; let bold = false;
  for (const part of str.split('**')) { for (const w of part.split(' ')) if (w) toks.push({ w, bold }); bold = !bold; }
  const lines = []; let line = [], x = 0;
  const sp = measure(' ', o);
  for (const tk of toks) {
    const ww = measure(tk.w, { ...o, w: tk.bold ? 800 : o.w });
    if (x + ww > maxW && line.length) { lines.push(line); line = []; x = 0; }
    line.push({ ...tk, x, ww }); x += ww + sp;
  }
  if (line.length) lines.push(line);
  return lines;
}
