  ['80px Anton', '80px "Mr Dafoe"', '40px "Press Start 2P"', '30px "IBM Plex Mono"', '600 30px "IBM Plex Mono"', 'italic 800 60px Archivo', '600 30px Archivo'].map(f => document.fonts.load(f).catch(() => null))
));
if (EXPORT) return;

let tl = 0, playing = false, lastPerf = 0, muted = false;
let A = null, master = null, sess = null, sessBus = null, acT0 = 0, tlT0 = 0, schedTo = 0;
const vi = SCENES[SCENES.length - 1];
const POSTER = vi.t0 + 13.2;

function audioStart() {
  if (!A) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    A = new AC(); master = masterChain(A);
  }
  if (A.state === 'suspended') A.resume();
  audioStop();
  sess = A.createGain(); sess.gain.value = muted ? 0 : 1; sess.connect(master);
  sessBus = makeBus(A, sess);
  acT0 = A.currentTime + .05; tlT0 = tl; schedTo = tl;
}
function audioStop() {
  if (sess && A) { const s = sess; s.gain.setTargetAtTime(0, A.currentTime, .03); setTimeout(() => s.disconnect(), 400); }
  sess = null; sessBus = null;
}
function pump() {
  if (!playing || !sessBus) return;
  const ahead = tl + .3;
  if (ahead > schedTo) { schedule(sessBus, schedTo, Math.min(ahead, DUR), x => acT0 + (x - tlT0)); schedTo = ahead; }
}
setInterval(pump, 60);

function setPlaying(p) {
  playing = p;
  $('gate').hidden = true;
  $('ppicon').innerHTML = p ? '<path d="M3 1.5h3.5v13H3zm6.5 0H13v13H9.5z"/>' : '<path d="M3 1.5v13l11-6.5z"/>';
  $('pp').setAttribute('aria-label', p ? 'Pause' : 'Play');
  if (p) { if (tl >= DUR - .05) tl = 0; lastPerf = performance.now(); audioStart(); requestAnimationFrame(frame); }
  else audioStop();
}
function seek(t) {
  tl = clamp(t, 0, DUR - .01);
  if (playing) audioStart();
  $('gate').hidden = true;
  draw();
}
function frame(now) {
  if (!playing) return;
  if (sess && A && A.state === 'running') tl = tlT0 + Math.max(0, A.currentTime - acT0);
  else tl += (now - lastPerf) / 1000;
  lastPerf = now;
  if (tl >= DUR) { tl = DUR; draw(); setPlaying(false); return; }
  pump(); draw();
  requestAnimationFrame(frame);
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let lastScene = null;
function draw() {
  render(tl);
  const pct = tl / DUR * 100;
  $('knob').style.left = pct + '%';
  $('fill').style.width = pct + '%';
  $('time').textContent = `${fmt(tl)} / ${fmt(DUR)}`;
  $('track').setAttribute('aria-valuenow', Math.floor(tl));
  const sc = sceneAt(tl);
  if (sc !== lastScene) {
    lastScene = sc;
    document.querySelectorAll('.chapters button').forEach(b => { const on = b.dataset.id === sc.id; b.classList.toggle('on', on); b.style.color = on ? sc.col : ''; });
  }
}
$('track').setAttribute('aria-valuemax', Math.floor(DUR));
const segs = $('segs'), fill = $('fill');
SCENES.forEach(sc => {
  const a = document.createElement('span'); a.style.flex = sc.d; a.style.background = sc.col; segs.appendChild(a);
  const b = document.createElement('span'); b.style.flex = 'none'; b.style.background = sc.col; b.style.height = '100%'; b.style.borderRadius = '2px';
  fill.appendChild(b);
  const btn = document.createElement('button'); btn.type = 'button'; btn.dataset.id = sc.id;
  btn.innerHTML = `<i style="background:${sc.col}"></i>${sc.label}`;
  btn.addEventListener('click', () => { seek(sc.t0 + .01); if (!playing) setPlaying(true); });
  $('chapters').appendChild(btn);
});
function sizeFill() { const w = $('track').clientWidth - 2 * (SCENES.length - 1); [...fill.children].forEach((c, i) => { c.style.width = (SCENES[i].d / DUR * w) + 'px'; }); }

$('bigplay').addEventListener('click', () => { tl = 0; setPlaying(true); });
$('pp').addEventListener('click', () => setPlaying(!playing));
cv.addEventListener('click', () => setPlaying(!playing));
$('snd').addEventListener('click', () => {
  muted = !muted; $('snd').textContent = muted ? 'OFF' : 'SND'; $('snd').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  if (sess && A) sess.gain.setTargetAtTime(muted ? 0 : 1, A.currentTime, .05);
});
$('fs').addEventListener('click', () => {
  const st = $('stage');
  try { if (document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen().catch(() => {}); } catch (e) { /* not supported */ }
});
const track = $('track');
let dragging = false;
const trackSeek = e => { const r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); trackSeek(e); });
track.addEventListener('pointermove', e => { if (dragging) trackSeek(e); });
track.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); seek(tl + 5); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(tl - 5); }
});
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fit(); sizeFill(); if (playing || $('gate').hidden) draw(); else render(POSTER); }, 80); });
document.addEventListener('fullscreenchange', () => setTimeout(() => { fit(); draw(); }, 60));

sizeFill();
tl = 0; draw(); render(POSTER);
window.__ready.then(() => { if (!playing && !$('gate').hidden) render(POSTER); });
setInterval(() => { if (!playing && !$('gate').hidden) render(POSTER); }, 1000);
})();

</script>
