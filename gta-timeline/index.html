<title>Dundee to Leonida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    color-scheme: dark;
    --ground: #07060b;
    --panel: #121019;
    --line: #2a2533;
    --ink: #f3efe8;
    --dim: #9a93a6;
    --hot: #ff4f9a;
    --sun: #ffb46b;
    --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--ui);
    padding-inline: 16px;
    padding-block: 20px 28px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .player {
    width: min(100%, calc((100vh - 190px) * 16 / 9), 1600px);
    min-width: min(100%, 320px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(255, 79, 154, .35), 0 0 0 1px var(--line);
  }
  .stage:fullscreen { border-radius: 0; box-shadow: none; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  .gate {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(7,6,11,.25), rgba(7,6,11,.8));
  }
  .gate button {
    font: 800 italic clamp(15px, 2.2vw, 26px) var(--ui);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #14060d;
    background: linear-gradient(95deg, #ff4f9a, #ffb46b);
    border: 0;
    border-radius: 999px;
    padding: .9em 1.6em;
    cursor: pointer;
    display: flex; align-items: center; gap: .7em;
    box-shadow: 0 10px 40px -8px rgba(255, 79, 154, .7);
    transition: transform .15s ease;
  }
  .gate button:hover { transform: scale(1.04); }
  .gate button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .gate small {
    display: block; margin-top: 14px; text-align: center;
    font: 400 clamp(11px, 1.2vw, 14px) var(--mono); color: var(--dim); letter-spacing: .14em;
  }
  .tri { width: 0; height: 0; border-left: .8em solid currentColor; border-top: .5em solid transparent; border-bottom: .5em solid transparent; }

  .bar { display: flex; align-items: center; gap: 12px; }
  .btn {
    flex: none;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; font: 600 12px var(--mono);
  }
  .btn:hover { border-color: var(--hot); }
  .btn:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }
  .time { flex: none; font: 400 13px var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; min-width: 96px; text-align: center; }
  .track {
    position: relative; flex: 1; height: 40px; cursor: pointer; touch-action: none;
  }
  .segs { position: absolute; left: 0; right: 0; top: 17px; height: 6px; display: flex; gap: 2px; }
  .segs span { height: 100%; border-radius: 2px; opacity: .35; }
  .fill { position: absolute; left: 0; top: 17px; height: 6px; display: flex; gap: 2px; overflow: hidden; pointer-events: none; }
  .knob {
    position: absolute; top: 12px; width: 16px; height: 16px; margin-left: -8px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.15), 0 0 18px rgba(255,79,154,.8);
    pointer-events: none;
  }
  .track:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; border-radius: 4px; }

  .chapters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chapters button {
    font: 600 12px var(--mono); letter-spacing: .04em;
    color: var(--dim); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 11px; cursor: pointer;
    display: flex; gap: 7px; align-items: center;
  }
  .chapters button i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .chapters button.on { color: var(--ink); border-color: currentColor; }
  .chapters button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .foot { font: 400 12px var(--mono); color: #6d6678; text-align: center; max-width: 70ch; line-height: 1.6; }
  @media (max-width: 560px) {
    .time { min-width: 0; font-size: 11px; }
    .bar { gap: 8px; }
    .btn { width: 36px; height: 36px; }
  }
</style>

<div class="player">
  <div class="stage" id="stage">
    <canvas id="screen" aria-label="Animated history of Grand Theft Auto, from 1995 to GTA VI"></canvas>
    <div class="gate" id="gate">
      <div>
        <button id="bigplay" type="button"><span class="tri"></span>Play the story</button>
        <small>3 MIN · SOUND ON · 1995 → 19.11.2026</small>
      </div>

  <div class="bar">
    <button class="btn" id="pp" type="button" aria-label="Play"><svg viewBox="0 0 16 16" id="ppicon"><path d="M3 1.5v13l11-6.5z"/></svg></button>

  </div>

  <p class="foot">A fan-made history. Grand Theft Auto is a trademark of Take-Two Interactive. This page isn't affiliated with Rockstar Games. Space plays and pauses, arrow keys skip.</p>

<script>
(() => {
'use strict';
const EXPORT = /[?&]export\b/.test(location.search);
const W = 1920, H = 1080;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
let S = 1;

const F = {
  disp: '"Anton", Impact, "Arial Narrow", sans-serif',
  script: '"Mr Dafoe", "Brush Script MT", cursive',
  pix: '"Press Start 2P", "Courier New", monospace',
  mono: '"IBM Plex Mono", Menlo, monospace',
  ui: '"Archivo", "Helvetica Neue", Arial, sans-serif',
};

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const eo3 = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eoX = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eoB = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const win = (lt, a, b, fi = .5, fo = .5) => inv(a, a + fi, lt) * (1 - inv(b - fo, b, lt));
const money = v => '$' + Math.floor(v).toLocaleString('en-US');

/* ---------- drawing helpers ---------- */
function T(str, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.a ?? 1);
  ctx.font = `${o.st || ''} ${o.w || ''} ${o.s || 60}px ${o.f || F.disp}`;
  ctx.textAlign = o.al || 'center';
  ctx.textBaseline = o.bl || 'middle';
  const ls = o.ls || 0;
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  const dx = (ctx.textAlign === 'center') ? ls / 2 : 0;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(str, x + dx + (o.sx ?? 6), y + (o.sy ?? 6)); }
  if (o.stroke) { ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(str, x + dx, y); }
  if (o.c !== null) { ctx.fillStyle = o.c || '#fff'; ctx.fillText(str, x + dx, y); }
  ctx.restore();
}
function measure(str, o) {
  ctx.save();
  ctx.font = `${o.st || ''} ${o.w || ''} ${o.s || 60}px ${o.f || F.disp}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (o.ls || 0) + 'px';
  const m = ctx.measureText(str).width;
  ctx.restore();
  return m;
}
function rect(x, y, w, h, c, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); ctx.restore(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function glowDisc(x, y, r, c, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function star(x, y, r, c) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = c; ctx.fill();
}
function typed(str, lt, start, cps = 48) { return str.slice(0, Math.max(0, Math.floor((lt - start) * cps))); }

function rain(lt, n, alpha, speed = 1) {
  ctx.save(); ctx.strokeStyle = `rgba(175,195,255,${alpha})`; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const sp = (1500 + hash(i + 7) * 900) * speed, len = 30 + hash(i + 3) * 50;
    const y = ((hash(i * 3.1) * (H + 200) + lt * sp) % (H + 200)) - 100;
    const x = hash(i * 1.7) * (W + 300) - 150 + y * .16;
    ctx.moveTo(x, y); ctx.lineTo(x + len * .16, y + len);
  }
  ctx.stroke(); ctx.restore();
}

function palm(x, by, h, lean, sway, col) {
  ctx.save(); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round';
  const n = 16, pts = [];
  for (let i = 0; i <= n; i++) { const k = i / n; pts.push([x + (lean * k * k) * h + sway * k * k * 14, by - k * h]); }
  for (let i = 0; i < n; i++) {
    ctx.lineWidth = lerp(h * .055, h * .028, i / n);
    ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
  }
  const [cx, cy] = pts[n];
  for (let f = 0; f < 9; f++) {
    const ang = -Math.PI + (f / 8) * Math.PI + Math.sin(sway * .8 + f) * .05;
    const len = h * (.42 + .16 * hash(f * 9 + x));
    const side = Math.abs(Math.cos(ang));
    const ex = cx + Math.cos(ang) * len, ey = cy + Math.sin(ang) * len * .35 + len * (.25 + .45 * side);
    const mx = cx + Math.cos(ang) * len * .55, my = cy + Math.sin(ang) * len * .55 - len * .05;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(mx, my - len * .06, ex, ey);
    ctx.quadraticCurveTo(mx, my + len * .08, cx, cy); ctx.fill();
    ctx.lineWidth = Math.max(1.5, h * .006);
    ctx.beginPath();
    for (let s = 2; s < 14; s++) {
      const u = s / 14, a1 = (1 - u) * (1 - u), a2 = 2 * (1 - u) * u, a3 = u * u;
      const px = a1 * cx + a2 * mx + a3 * ex, py = a1 * cy + a2 * my + a3 * ey;
      const l = len * .16 * (1 - u * .7);
      ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(ang + 1.2) * l, py + l * .9);
      ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(ang - 1.2) * l, py + l * .9);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function makeSkyline(seed, count, x0, x1, minH, maxH, wMin = 40, wMax = 120) {
  const out = []; let x = x0, i = 0;
  while (x < x1 && i < count) {
    const w = lerp(wMin, wMax, hash(seed + i * 3.3)), h = lerp(minH, maxH, Math.pow(hash(seed + i * 7.1), 1.6));
    out.push({ x, w, h, ant: hash(seed + i * 5.9) > .82, step: hash(seed + i * 2.2) > .6, lit: seed + i });
    x += w + lerp(0, 14, hash(seed + i * 1.9)); i++;
  }
  return out;
}
function drawSkyline(sk, baseY, col, dx = 0, win = null, winA = 1) {
  ctx.save(); ctx.fillStyle = col;
  for (const b of sk) {
    const x = b.x + dx;
    ctx.fillRect(x, baseY - b.h, b.w, b.h + 2);
    if (b.step) ctx.fillRect(x + b.w * .2, baseY - b.h - b.h * .12, b.w * .6, b.h * .12 + 1);
    if (b.ant) ctx.fillRect(x + b.w / 2 - 2, baseY - b.h - b.h * .3, 4, b.h * .3);
  }
  if (win) {
    ctx.fillStyle = win;
    for (const b of sk) {
      const x = b.x + dx;
      for (let wy = baseY - b.h + 12; wy < baseY - 8; wy += 16)
        for (let wx = x + 8; wx < x + b.w - 8; wx += 13)
          if (hash(b.lit * 13 + wx * .7 + wy * .31) > .72) { ctx.globalAlpha = winA * (.4 + .6 * hash(wx + wy)); ctx.fillRect(wx, wy, 5, 7); }
    }
  }
  ctx.restore();
}

/* ---------- captions ---------- */
function captions(list, lt) {
  for (const [a, b, str] of list) {
    if (lt < a || lt > b) continue;
    const alpha = win(lt, a, b, .2, .35);
    const shown = typed(str, lt, a, 55);
    const full = measure(str, { f: F.mono, s: 34, w: 400 });
    const y = H - 176;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(6,5,10,.62)';
    rrect(W / 2 - full / 2 - 26, y - 34, full + 52, 68, 6); ctx.fill();
    ctx.font = `400 34px ${F.mono}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.fillStyle = '#f3efe8';
    ctx.fillText(shown, W / 2 - full / 2, y + 2);
    if (shown.length < str.length) {
      const cw = ctx.measureText(shown).width;
      ctx.fillStyle = '#ff4f9a'; ctx.fillRect(W / 2 - full / 2 + cw + 4, y - 16, 14, 34);
    }
    ctx.restore();
  }
}

/* ---------- precomputed art ---------- */
const skyIVfar = makeSkyline(11, 80, -100, 2400, 120, 340, 50, 110);
const skyIVmid = makeSkyline(29, 80, -100, 2400, 80, 260, 60, 140);
const skyLS = makeSkyline(41, 60, 180, 1500, 60, 380, 40, 100);
const skyVI = makeSkyline(57, 60, 380, 1560, 40, 250, 26, 70);
const sky98 = makeSkyline(71, 30, 0, 640, 80, 330, 30, 80);
const saLand = [];
for (let i = 0; i < 90; i++) {
  const th = i / 90 * Math.PI * 2;
  const r = 380 * (1 + .1 * Math.sin(3 * th + 1) + .06 * Math.sin(7 * th + 2) + .035 * Math.sin(15 * th));
  saLand.push([Math.cos(th) * r * 1.15, Math.sin(th) * r * .95]);
}
const grain = [];
for (let k = 0; k < 4; k++) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() > .5 ? 255 : 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = Math.random() * 38; }
  g.putImageData(im, 0, 0); grain.push(c);
}
const pix = document.createElement('canvas'); pix.width = 480; pix.height = 270;
const px = pix.getContext('2d');

/* ================= SCENES ================= */

function sOpen(lt, d) {
  rect(0, 0, W, H, '#05060a');
  glowDisc(1480, 180, 900, 'rgba(255,140,60,.20)', inv(0, 4, lt));
  glowDisc(1480, 180, 160, 'rgba(255,190,120,.35)', inv(0, 4, lt));
  // wet street reflection
  ctx.save(); ctx.globalAlpha = .5 * inv(1, 5, lt);
  const g = ctx.createLinearGradient(0, 760, 0, H); g.addColorStop(0, 'rgba(255,140,60,0)'); g.addColorStop(1, 'rgba(255,140,60,.18)');
  ctx.fillStyle = g; ctx.fillRect(1380, 760, 200, H - 760); ctx.restore();
  rain(lt, 260, .22);
  const t1 = 'Every empire starts somewhere.';
  T(typed(t1, lt, .6, 20), W / 2, H / 2 - 10, { f: F.mono, s: 50, w: 400, c: '#e9e4da', a: 1 - inv(4.1, 4.6, lt) });
  if (lt > 4.8) {
    const k = eo3(inv(4.8, 7.5, lt)), sc = 1 + .035 * inv(4.8, d, lt);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc);
    T('DUNDEE, SCOTLAND', 0, -30, { s: 190, ls: lerp(44, 18, k), a: inv(4.8, 5.8, lt), c: '#f3efe8' });
    T('1995  ·  A SMALL STUDIO CALLED DMA DESIGN', 0, 110, { f: F.mono, s: 32, ls: 6, a: inv(6.2, 7.0, lt), c: '#ffb46b' });
    ctx.restore();
  }
}

function roadLoop(u) {
  const x0 = 380, x1 = 1540, y0 = 300, y1 = 780, w = x1 - x0, h = y1 - y0, P = 2 * (w + h);
  let s = ((u % 1) + 1) % 1 * P;
  if (s < w) return [x0 + s, y0, 0]; s -= w;
  if (s < h) return [x1, y0 + s, Math.PI / 2]; s -= h;
  if (s < w) return [x1 - s, y1, Math.PI]; s -= w;
  return [x0, y1 - s, -Math.PI / 2];
}
function carTop(x, y, a, body, roof, len = 64, wid = 32) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-len / 2 + 4, -wid / 2 + 6, len, wid);
  ctx.fillStyle = body; rrect(-len / 2, -wid / 2, len, wid, 6); ctx.fill();
  ctx.fillStyle = roof; ctx.fillRect(-len * .12, -wid / 2 + 4, len * .36, wid - 8);
  ctx.fillStyle = 'rgba(160,210,255,.8)'; ctx.fillRect(len * .24, -wid / 2 + 5, len * .1, wid - 10);
  ctx.restore();
}
function sRace(lt, d) {
  rect(0, 0, W, H, '#0a1a2e');
  ctx.save(); ctx.strokeStyle = 'rgba(120,170,255,.10)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.strokeStyle = 'rgba(120,170,255,.22)'; ctx.beginPath();
  for (let x = 0; x <= W; x += 200) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 200) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
  // road
  ctx.save(); ctx.strokeStyle = '#1b2a40'; ctx.lineWidth = 86; ctx.lineJoin = 'round';
  ctx.strokeRect(380, 300, 1160, 480);
  ctx.strokeStyle = 'rgba(255,220,120,.5)'; ctx.lineWidth = 3; ctx.setLineDash([22, 22]); ctx.lineDashOffset = -lt * 60;
  ctx.strokeRect(380, 300, 1160, 480); ctx.restore();
  // chase
  const u = lt * .085;
  const bump = lt > 4.4 ? Math.max(0, Math.sin(lt * 7)) * .012 : 0;
  const [rx, ry, ra] = roadLoop(u), [cx, cy, ca] = roadLoop(u - .05 + bump + (lt > 4.4 ? .025 : 0));
  carTop(rx, ry + (lt > 4.4 ? Math.sin(lt * 9) * 6 : 0), ra, '#e0463a', '#8e231c');
  const flash = Math.floor(lt * 7) % 2;
  carTop(cx, cy, ca, '#e8ecf2', '#1b1f28');
  glowDisc(cx, cy, 70, flash ? 'rgba(255,40,60,.7)' : 'rgba(40,110,255,.7)', .9);
  if (lt > 4.4) {
    for (let i = 0; i < 6; i++) {
      const k = (lt * 3 + i / 6) % 1;
      ctx.save(); ctx.globalAlpha = (1 - k) * .8; ctx.fillStyle = '#ffd36b';
      ctx.fillRect(rx + (hash(i + Math.floor(lt * 3)) - .5) * 80 * k, ry + (hash(i * 2 + Math.floor(lt * 3)) - .5) * 80 * k, 5, 5); ctx.restore();
    }
  }
  // project file card
  const cardA = inv(.2, .8, lt);
  ctx.save(); ctx.globalAlpha = cardA; ctx.translate(0, (1 - eo3(cardA)) * 30);

function s3(lt, d) {

/* ================= EXPORT HOOKS ================= */
window.__DUR = DUR;
window.__render = t => render(t);

/* ================= PLAYER ================= */
const $ = id => document.getElementById(id);
function fit() {
  if (EXPORT) { cv.width = W; cv.height = H; S = 1; return; }
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(320, Math.round(r.width * dpr)); cv.height = Math.round(cv.width * 9 / 16); S = cv.width / W;
}
fit();
window.__ready = document.fonts.ready.then(() => Promise.all(
  ['80px Anton', '80px "Mr Dafoe"', '40px "Press Start 2P"', '30px "IBM Plex Mono"', '600 30px "IBM Plex Mono"', 'italic 800 60px Archivo', '600 30px Archivo'].map(f => document.fonts.load(f).catch(() => null))
));
if (EXPORT) return;

let tl = 0, playing = false, lastPerf = 0, muted = false;
let A = null, master = null, sess = null, acT0 = 0, tlT0 = 0, schedTo = 0;
const POSTER = SCENES[11].t0 + 12.2;

function audioStart() {
  if (!A) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    A = new AC(); master = masterChain(A);
  }
  if (A.state === 'suspended') A.resume();

  acT0 = A.currentTime + .05; tlT0 = tl; schedTo = tl;

}

}
setInterval(pump, 60);

function setPlaying(p) {
  playing = p;
  $('gate').hidden = true;
  $('ppicon').innerHTML = p ? '<path d="M3 1.5h3.5v13H3zm6.5 0H13v13H9.5z"/>' : '<path d="M3 1.5v13l11-6.5z"/>';

let lastScene = null;

  $('knob').style.left = pct + '%';
  $('fill').style.width = pct + '%';
  $('time').textContent = `${fmt(tl)} / ${fmt(DUR)}`;
  $('track').setAttribute('aria-valuenow', Math.floor(tl));

    document.querySelectorAll('.chapters button').forEach(b => { const on = b.dataset.id === sc.id; b.classList.toggle('on', on); b.style.color = on ? sc.col : ''; });
  }

// build UI
const segs = $('segs'), fill = $('fill');
SCENES.forEach(sc => {
  const a = document.createElement('span'); a.style.flex = sc.d; a.style.background = sc.col; segs.appendChild(a);
  const b = document.createElement('span'); b.style.flex = 'none'; b.style.background = sc.col; b.style.height = '100%'; b.style.borderRadius = '2px';
  fill.appendChild(b);
  const btn = document.createElement('button'); btn.type = 'button'; btn.dataset.id = sc.id;
  btn.innerHTML = `<i style="background:${sc.col}"></i>${sc.label}`;
  btn.addEventListener('click', () => { seek(sc.t0 + .01); if (!playing) setPlaying(true); });
  $('chapters').appendChild(btn);
});
// fill children widths need to be relative to the full track, not the clipped fill
function sizeFill() { const w = $('track').clientWidth - 2 * (SCENES.length - 1); [...fill.children].forEach((c, i) => { c.style.width = (SCENES[i].d / DUR * w) + 'px'; }); }

$('bigplay').addEventListener('click', () => { tl = 0; setPlaying(true); });
$('pp').addEventListener('click', () => setPlaying(!playing));
cv.addEventListener('click', () => setPlaying(!playing));
$('snd').addEventListener('click', () => {
  muted = !muted; $('snd').textContent = muted ? 'OFF' : 'SND'; $('snd').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  if (sess && A) sess.gain.setTargetAtTime(muted ? 0 : 1, A.currentTime, .05);
});
$('fs').addEventListener('click', () => {
  const st = $('stage');
  try { if (document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen().catch(() => {}); } catch (e) { /* not supported */ }
});
const track = $('track');
let dragging = false;
const trackSeek = e => { const r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); trackSeek(e); });

  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }

window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fit(); sizeFill(); draw(); }, 80); });

})();
